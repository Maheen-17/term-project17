name: Staging CI/CD

on:
  push:
    branches:
      - release/v1.0

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install project dependencies
        run: npm install

      - name: Lint HTML files
        run: |
          npx htmlhint "**/*.html" || echo "HTML Lint Failed (ignored)"

      - name: Lint CSS files
        run: |
          npx stylelint "**/*.css" || echo "CSS Lint Failed (ignored)"

      - name: Build website with Parcel
        run: npm run build

      - name: Show deploy message
        run: echo "✅ Deployed to staging environment successfully!"
